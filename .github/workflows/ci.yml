# Intégration continue : à chaque push et pull request, le rituel de
# vérification du projet (typecheck, lint, format, tests unitaires et tests
# contre PostgreSQL), l'audit des dépendances de production, puis la suite
# navigateur. Aucun secret requis : bases de CI éphémères, données fictives,
# comptes de test publics (test/support/config.ts).
# Actions épinglées par SHA (le tag en commentaire ; Dependabot les met à jour),
# permissions en lecture seule, exécutions superposées annulées, délais bornés.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fig
          POSTGRES_PASSWORD: fig
          POSTGRES_DB: fig_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fig -d fig_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fig:fig@localhost:5434/fig_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: dashboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fig
          POSTGRES_PASSWORD: fig
          POSTGRES_DB: fig_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fig -d fig_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fig:fig@localhost:5434/fig_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Migrations et seed de la base de test : e2e/global-setup.ts.
      - name: Suite navigateur sur PostgreSQL
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7
